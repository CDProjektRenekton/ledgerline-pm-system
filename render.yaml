services:
  - type: web
    name: pm-system-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pm-system-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: https://pm-system-frontend.onrender.com

  - type: web
    name: pm-system-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://pm-system-backend.onrender.com/api
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://sites.google.com https://*.googleusercontent.com https://*.google.com"
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pm-system-db
    plan: free
